name: CI Pipeline (Linux C++20)

on:
  push:
    branches:
      - main
      - dev
      - foundation
      - 'feat/**'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Compiler Matrix Builds & Unit Tests (GCC 13 & Clang 17)
  # ----------------------------------------------------------------------------
  matrix-build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gcc-13
            cc: gcc-13
            cxx: g++-13
            preset: debug
            name: "GCC 13 (Debug)"
          - id: gcc-13
            cc: gcc-13
            cxx: g++-13
            preset: release
            name: "GCC 13 (Release)"
          - id: clang-17
            cc: clang-17
            cxx: clang++-17
            preset: debug
            name: "Clang 17 (Debug)"
          - id: clang-17
            cc: clang-17
            cxx: clang++-17
            preset: release
            name: "Clang 17 (Release)"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libsqlite3-dev \
            ${{ matrix.cc }} \
            ${{ matrix.cxx }}

      - name: Configure CMake Preset (${{ matrix.preset }})
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run Tests (${{ matrix.preset }})
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  # ----------------------------------------------------------------------------
  # 2. Runtime Sanitizers (ASan, UBSan, TSan)
  # ----------------------------------------------------------------------------
  sanitizers:
    name: Sanitizer (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libsqlite3-dev \
            clang-17 \
            clang++-17

      - name: Configure Sanitizer Preset (${{ matrix.preset }})
        env:
          CC: clang-17
          CXX: clang++-17
        run: cmake --preset ${{ matrix.preset }}

      - name: Build Sanitizer Target (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run Sanitizer Test Suite (${{ matrix.preset }})
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:fast_unwind_on_malloc=0"
          TSAN_OPTIONS: "abort_on_error=1:report_atomic_races=1"
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  # ----------------------------------------------------------------------------
  # 3. Code Formatting Verification
  # ----------------------------------------------------------------------------
  formatting-check:
    name: Code Formatting (clang-format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Verify Clang-Format Compliance
        run: |
          find src include tests -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.c" -o -name "*.h" \) 2>/dev/null | while read -r file; do
            clang-format --dry-run --Werror "$file" || exit 1
          done
          echo "All source files conform to .clang-format."
